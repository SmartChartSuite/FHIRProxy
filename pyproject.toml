[project]
name = "fhirproxy"
version = "0.1.0"
description = "FHIRProxy for Standardizing FHIR search across various FHIR data sources"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.4,<1",
    "fastapi-utils[all]>=0.8.0,<1",
    "fhirsearchhelper>=0.7.0",
    "httpx>=0.28.1,<1",
    "hypercorn>=0.18.0,<1",
    "loguru>=0.7.3,<1",
    "pyjwt[crypto]>=2.15.1,<3"
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "pytest-env>=1.2.0,<2",
    "ruff>=0.17.4,<1",
]

[tool.uv]
package = false
exclude-newer = "7 days"
exclude-newer-package = { fhirsearchhelper = "2026-11-19T14:31:33Z" }

[tool.ruff]
line-length = 200

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
pythonpath = ". src"
log_cli = true
log_cli_level = "INFO"